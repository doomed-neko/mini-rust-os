name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Get toolchain
        run: rustup toolchain install nightly-2025-06-25-x86_64-unknown-linux-gnu
      - name: Get toolchain components
        run: rustup component add rust-src --toolchain nightly-2025-06-25-x86_64-unknown-linux-gnu
      - name: Install bootimage
        run: cargo install bootimage --version 0.9.0
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
