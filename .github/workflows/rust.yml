name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        uses: tecolicom/actions-use-apt-tools@v1
        with:
          tools: qemu-kvm qemu-system qemu-utils
          cache: yes
      - name: Install latest nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2025-06-25-x86_64-unknown-linux-gnu
          override: true
          components: rust-src, llvm-tools-preview
      - name: Install bootimage
        run: cargo install bootimage --version 0.9.0
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
