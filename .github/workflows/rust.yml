name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 libfdt1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-06-25-x86_64-unknown-linux-gnu
          components: rust-src, llvm-tools-preview

      - name: Cache Cargo & Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache cargo-install binaries
        id: cache-cargo-bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bootimage
          key: ${{ runner.os }}-bootimage-0.9.0

      - name: Install bootimage
        if: steps.cache-cargo-bin.outputs.cache-hit != 'true'
        run: cargo install bootimage --version 0.9.0 --locked

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test
