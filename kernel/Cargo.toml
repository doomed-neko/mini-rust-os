[package]
name = "brevyos"
version = "0.1.0"
edition = "2024"

[[test]]
harness = false
name = "should_panic"

[[test]]
harness = false
name = "stack_overflow"

[dependencies]
bootloader_api = "0.11"
bootloader-x86_64-common = "0.11.17"
embedded-graphics = "0.8.2"
lazy_static = { version = "1.0", features = ["spin_no_std"] }
linked_list_allocator = "0.9.0"
pc-keyboard = "0.7.0"
pic8259 = "0.10.1"
spin = "0.5.2"
uart_16550 = "0.2.0"
volatile = "0.2.6"
x86_64 = "0.15.5"

[dependencies.conquer-once]
version = "0.2.0"
default-features = false

[dependencies.crossbeam-queue]
version = "0.3.11"
default-features = false
features = ["alloc"]

[dependencies.futures-util]
version = "0.3.4"
default-features = false
features = ["alloc"]

[dependencies.log]
version = "0.4.17"
default-features = false

[dependencies.noto-sans-mono-bitmap]
version = "0.2.0"
default-features = false
features = [
  "regular",
  "size_16",
  "unicode-basic-latin",
  # required for the fallback char '�'
  "unicode-specials",
]
